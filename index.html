<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="transparent">
  <title>Звёздное превращение</title>
  <style>
    :root {
      color-scheme: light;
      background: transparent;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      background: transparent !important;
    }

    canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    #glow {
      position: absolute;
      inset: -8%;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 42% 46%, rgba(157,102,255,.38), transparent 47%),
        radial-gradient(ellipse at 59% 54%, rgba(67,208,255,.30), transparent 49%),
        radial-gradient(ellipse at center, rgba(119,112,255,.22), transparent 68%);
      filter: blur(9px);
      animation: breathe 4.8s ease-in-out infinite alternate;
      mix-blend-mode: screen;
    }

    @keyframes breathe {
      from { opacity: .48; transform: scale(.91) rotate(-2deg); }
      to { opacity: 1; transform: scale(1.1) rotate(2deg); }
    }

    #toolbar {
      position: absolute;
      z-index: 5;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100% - 24px);
      padding: 8px;
      border: 1px solid rgba(211,198,255,.25);
      border-radius: 14px;
      color: #f7f1ff;
      background: rgba(20,16,42,.76);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 30px #09051a44;
    }

    /* Прячет панель и надписи именно в готовом виджете. */
    #toolbar[hidden], #badge[hidden], #empty[hidden], #result-wrap[hidden] {
      display: none !important;
    }

    button, .file-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 11px;
      border: 0;
      border-radius: 9px;
      color: #211338;
      background: linear-gradient(110deg,#d5c3ff,#a6edff);
      font: 600 13px system-ui, sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }

    button.secondary {
      color: #f2eaff;
      background: #ffffff16;
      border: 1px solid #ffffff26;
    }

    input[type="file"] { display: none; }

    #hint {
      color: #e5dcff;
      font-size: 12px;
      padding: 0 5px;
    }

    #badge {
      position: absolute;
      right: 12px;
      bottom: 10px;
      color: #f8f3ff;
      font: 11px system-ui, sans-serif;
      opacity: .65;
      pointer-events: none;
      text-shadow: 0 1px 5px #281455;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .empty span {
      padding: 13px 17px;
      border: 1px dashed #d7c8ff88;
      border-radius: 16px;
      color: #fff;
      background: #33245055;
      font-size: 14px;
      text-shadow: 0 2px 8px #000;
    }

    #result-wrap {
      position: absolute;
      z-index: 6;
      top: 64px;
      left: 12px;
      width: min(520px, calc(100% - 24px));
      padding: 10px;
      border: 1px solid rgba(211,198,255,.25);
      border-radius: 12px;
      color: #f7f1ff;
      background: rgba(20,16,42,.92);
    }

    #result-wrap p { margin: 0 0 7px; font-size: 12px; }

    #result-code {
      display: block;
      width: 100%;
      height: 82px;
      resize: vertical;
      border: 1px solid #ffffff38;
      border-radius: 8px;
      padding: 8px;
      color: #fff;
      background: #100d20;
      font: 11px/1.4 ui-monospace, monospace;
    }

    @media (max-width: 520px) {
      #toolbar { left: 7px; top: 7px; gap: 5px; padding: 6px; }
      .file-label, button { min-height: 32px; padding: 7px 8px; font-size: 11px; }
      #hint { display: none; }
      #result-wrap { top: 54px; left: 7px; width: calc(100% - 14px); }
    }
  </style>
</head>
<body>
  <main id="stage">
    <canvas id="art" aria-label="Картинка со звёздным свечением"></canvas>
    <div id="glow" aria-hidden="true"></div>
    <div class="empty" id="empty"><span>Загрузи прозрачную PNG-картинку</span></div>

    <div id="toolbar">
      <label class="file-label" for="file">✦ Выбрать картинку</label>
      <input id="file" type="file" accept="image/png,image/webp">
      <button id="toggle" class="secondary" type="button">Пауза</button>
      <button id="save" class="secondary" type="button">Получить код для Genially</button>
      <span id="hint">Подойдёт прозрачный PNG</span>
    </div>

    <div id="result-wrap" hidden>
      <p id="result-message">Код для Genially скопирован. Если не скопировался, выдели текст ниже и скопируй его.</p>
      <textarea id="result-code" readonly aria-label="Код виджета для Genially"></textarea>
    </div>

    <div id="badge">Звёздное превращение</div>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector('#art');
      const ctx = canvas.getContext('2d');
      const file = document.querySelector('#file');
      const empty = document.querySelector('#empty');
      const hint = document.querySelector('#hint');
      const resultWrap = document.querySelector('#result-wrap');
      const resultCode = document.querySelector('#result-code');
      const resultMessage = document.querySelector('#result-message');

      let img = null;
      let running = true;
      let w = 0, h = 0, dpr = 1, last = 0;

      const params = new URLSearchParams(location.search);
      const embedMode = params.has('embed');
      if (embedMode) {
        document.querySelector('#toolbar').hidden = true;
        document.querySelector('#badge').hidden = true;
        empty.hidden = true;
      }

      const stars = Array.from({ length: 68 }, () => ({
        phase: Math.random() * Math.PI * 2,
        speed: .18 + Math.random() * .42,
        radius: 1.5 + Math.random() * 3.4,
        hue: Math.random() < .55 ? 190 : 264
      }));

      function resize() {
        const box = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = box.width;
        h = box.height;
        canvas.width = Math.max(1, Math.round(w * dpr));
        canvas.height = Math.max(1, Math.round(h * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      new ResizeObserver(resize).observe(canvas);
      resize();

      function draw(timestamp) {
        requestAnimationFrame(draw);
        if (!running || timestamp - last < 30) return;
        last = timestamp;
        ctx.clearRect(0, 0, w, h);
        const time = timestamp / 1000;

        if (!img || !w || !h) return;

        // Картинка вписывается в рамку с сохранением исходных пропорций.
        const scale = Math.min(w * .68 / img.naturalWidth, h * .68 / img.naturalHeight);
        const iw = img.naturalWidth * scale;
        const ih = img.naturalHeight * scale;
        const x = (w - iw) / 2;
        const y = (h - ih) / 2;

        // Мягкое фиолетово-голубое сияние на прозрачном фоне.
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.filter = `blur(${18 + Math.sin(time * .7) * 5}px)`;
        ctx.globalAlpha = .72;
        ctx.drawImage(img, x - iw * .05, y - ih * .05, iw * 1.1, ih * 1.1);
        ctx.filter = `blur(${11 + Math.cos(time * .6) * 4}px)`;
        ctx.globalAlpha = .48;
        ctx.drawImage(img, x - iw * .025, y - ih * .025, iw * 1.05, ih * 1.05);
        ctx.restore();

        // Лёгкое мерцание не растягивает картинку целиком.
        ctx.save();
        ctx.globalAlpha = .78;
        ctx.filter = `blur(${3.5 + Math.abs(Math.sin(time)) * 2}px)`;
        const bands = 48;
        const sourceBand = img.naturalHeight / bands;
        for (let i = 0; i < bands; i++) {
          const sy = i * sourceBand;
          const wave = Math.sin(time * .55 + i * .29) * Math.min(6, iw * .018);
          const widthShift = 1 + Math.sin(time * .46 + i * .41) * .012;
          ctx.drawImage(
            img,
            0, sy, img.naturalWidth, sourceBand + 1,
            x + wave, y + (sy / img.naturalHeight) * ih,
            iw * widthShift, ih / bands + 1
          );
        }
        ctx.restore();

        // Звёзды остаются рядом с картинкой и обрезаются краями виджета.
        stars.forEach((star, index) => {
          const angle = time * star.speed + star.phase;
          const rx = iw * (.52 + (index % 5) * .035);
          const ry = ih * (.52 + (index % 4) * .04);
          const sx = w / 2 + Math.cos(angle) * rx;
          const sy = h / 2 + Math.sin(angle * 1.13) * ry;
          const pulse = .38 + .62 * (.5 + .5 * Math.sin(time * .8 + star.phase));

          ctx.save();
          ctx.globalAlpha = pulse;
          ctx.shadowBlur = 13 + star.radius * 3.5;
          ctx.shadowColor = star.hue === 190 ? '#8beaff' : '#c6a4ff';
          ctx.fillStyle = star.hue === 190 ? '#b8f4ff' : '#e0caff';
          ctx.beginPath();
          ctx.arc(sx, sy, star.radius * pulse, 0, Math.PI * 2);
          ctx.fill();

          if (index % 3 === 0) {
            ctx.strokeStyle = ctx.fillStyle;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(sx - 6, sy); ctx.lineTo(sx + 6, sy);
            ctx.moveTo(sx, sy - 6); ctx.lineTo(sx, sy + 6);
            ctx.stroke();
          }
          ctx.restore();
        });
      }

      requestAnimationFrame(draw);

      function loadImage(src, fallback) {
        const next = new Image();
        next.onload = () => {
          img = next;
          empty.hidden = true;
        };
        next.onerror = () => {
          if (fallback) loadImage(fallback);
          else if (!embedMode) empty.hidden = false;
        };
        next.src = src;
      }

      file.addEventListener('change', event => {
        const selected = event.target.files && event.target.files[0];
        if (!selected) return;
        if (!['image/png', 'image/webp'].includes(selected.type)) {
          hint.textContent = 'Выбери прозрачный PNG или WebP';
          file.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = () => loadImage(reader.result);
        reader.onerror = () => { hint.textContent = 'Не удалось открыть картинку'; };
        reader.readAsDataURL(selected);
        resultWrap.hidden = true;
        hint.textContent = 'Картинка загружена';
      });

      document.querySelector('#toggle').addEventListener('click', event => {
        running = !running;
        event.currentTarget.textContent = running ? 'Пауза' : 'Продолжить';
      });

      // Уменьшает картинку, сохраняя прозрачность, чтобы ссылка помещалась в Genially.
      function imageToCompactWebP(image) {
        return new Promise((resolve, reject) => {
          const maxSide = 700;
          const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
          const compact = document.createElement('canvas');
          compact.width = Math.max(1, Math.round(image.naturalWidth * scale));
          compact.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const compactContext = compact.getContext('2d');
          compactContext.clearRect(0, 0, compact.width, compact.height);
          compactContext.drawImage(image, 0, 0, compact.width, compact.height);
          compact.toBlob(blob => {
            if (!blob) { reject(new Error('Не удалось уменьшить картинку')); return; }
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          }, 'image/webp', .78);
        });
      }

      document.querySelector('#save').addEventListener('click', async () => {
        if (!img) {
          hint.textContent = 'Сначала загрузи картинку';
          return;
        }
        try {
          const compactImage = await imageToCompactWebP(img);
          const widgetUrl = new URL(location.href);
          widgetUrl.searchParams.set('embed', '1');
          widgetUrl.hash = encodeURIComponent(compactImage);

          const embedCode = `<iframe src="${widgetUrl.href}" width="420" height="340" frameborder="0" style="display:block;border:0;background:transparent" allowfullscreen></iframe>`;
          resultCode.value = embedCode;
          resultWrap.hidden = false;

          try {
            await navigator.clipboard.writeText(embedCode);
            resultMessage.textContent = 'Готовый код скопирован. В Genially вставь его через «Вставить» → «Другие». Если нужно, код можно скопировать из поля ниже.';
            hint.textContent = 'Код скопирован для Genially';
          } catch {
            resultMessage.textContent = 'Код готов. Выдели текст ниже и скопируй его для Genially.';
            resultCode.focus();
            resultCode.select();
            hint.textContent = 'Код готов — скопируй его из поля';
          }
        } catch {
          hint.textContent = 'Не получилось подготовить картинку. Попробуй PNG поменьше.';
        }
      });

      function loadImageFromHash() {
        if (location.hash.length > 20) {
          try {
            loadImage(decodeURIComponent(location.hash.slice(1)), 'assets/mouse.png');
            return;
          } catch {
            // При ошибке загрузится стандартная картинка.
          }
        }
        loadImage('assets/mouse.png', 'mouse.png');
      }

      loadImageFromHash();
    })();
  </script>
</body>
</html>
